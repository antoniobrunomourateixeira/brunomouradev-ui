<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground · @brunomouradev/tree-list</title>
    <style>
      :root {
        --pg-bg: #f4f5f7;
        --pg-text: #1f2328;
        --pg-muted: #636c76;
        --pg-link: #1f6feb;
        color-scheme: light;
      }
      :root.pg-dark {
        --pg-bg: #0d1117;
        --pg-text: #e6edf3;
        --pg-muted: #8d96a0;
        --pg-link: #4493f8;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--pg-bg);
        color: var(--pg-text);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 auto 0 0;
      }
      nav a {
        color: var(--pg-link);
        margin-right: 12px;
        font-size: 14px;
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      bm-tree-list {
        height: 640px;
      }
      /* Conta com estouro de orçamento: o CSS da página alcança a linha pelo part */
      bm-tree-list::part(estourou) {
        --bm-row-bg: rgba(201, 42, 42, 0.08);
      }
      #log {
        margin-top: 12px;
        font: 12px ui-monospace, monospace;
        color: var(--pg-muted);
        min-height: 1.5em;
        white-space: pre-wrap;
      }
      @media (max-width: 600px) {
        body { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>@brunomouradev/tree-list</h1>
      <nav><a href="/">DataGrid</a><a href="/pivot.html">PivotGrid</a><a href="/tree.html">TreeList</a></nav>
      <div class="controls">
        <label><input type="checkbox" id="opt-filter" /> Filter row</label>
        <label><input type="checkbox" id="opt-alt" /> Linhas alternadas</label>
        <label><input type="checkbox" id="opt-lazy" /> Carregar sob demanda</label>
        <label>
          Seleção
          <select id="opt-selection">
            <option value="none">nenhuma</option>
            <option value="single">única</option>
            <option value="multiple" selected>múltipla (cascata)</option>
          </select>
        </label>
      </div>
    </header>

    <bm-tree-list
      id="tree"
      show-search-panel
      show-export-button
      show-expand-buttons
      selection-mode="multiple"
    ></bm-tree-list>
    <div id="log"></div>

    <script type="module" src="/src/tree.ts"></script>
  </body>
</html>
